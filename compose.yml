services:
  handler:
    image: ghcr.io/shyndman/lmnop-handler:latest
    restart: unless-stopped
    environment:
      # Example: {"claude":"secret-token"}
      LMNOP_HANDLER_BEARER_TOKENS: ${LMNOP_HANDLER_BEARER_TOKENS:?set LMNOP_HANDLER_BEARER_TOKENS to a JSON bearer token map}
      OBSIDIAN_AUTOSTART: ${OBSIDIAN_AUTOSTART:-true}
    ports:
      - "${LMNOP_HANDLER_HTTP_PORT:-8000}:8000"
      - "${LMNOP_HANDLER_DESKTOP_PORT:-8080}:8080"
    volumes:
      - lmnop-handler-config:/config
      - lmnop-handler-vaults:/vaults

volumes:
  lmnop-handler-config:
  lmnop-handler-vaults:
